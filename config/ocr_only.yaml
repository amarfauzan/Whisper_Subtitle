chunk_length_seconds: 600

whisper:
  mode: server
  strategy: whole            # ← new: whole | vad_segments
  language: ko
  beam_size: 3
  best_of: 3
  max_line_length: 30
  server_host: 127.0.0.1
  server_port: 8080
  server_threads: 8
  server_startup_timeout: 60.0
  server_request_timeout: 300.0
  vad_segments:              # ← new
    padding: 0.15
    merge_gap: 0.05
    min_segment_duration: 0.3

vad:
  max_merge_duration: 2.0
  max_speech_duration: 6.0

translation:
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  source_language: Korean
  target_language: English
  batch_size: 100
  max_retries: 3
  min_split_size: 50
  context: ""

transcription:
  enabled: false

ocr:
  enabled: true
  crop_top_ratio: 0.3
  crop_bottom_ratio: 0.05
  crop_left_ratio: 0.1
  crop_right_ratio: 0.1
  providers: ["CPUExecutionProvider"]
  sample_fps: 2
  rec_confidence: 0.6       # stricter without whisper to validate
  llm_filter:
    enabled: true
    model: deepseek-chat
    batch_size: 100
    min_events: 5
    source_language: Korean
    content_type: variety show
  filter:
    min_duration: 0.0       # at 2 fps a fast caption is a single frame (duration 0)
    max_duration: 8.0
    min_box_height_ratio: 0.02
    max_box_height_ratio: 1.0
    timestamp_padding: 0.25
    min_text_length: 2
    min_confidence: 0.80
    max_text_repeats: 2     # drop texts seen 3+ times — but only if persistent
    repeat_span_seconds: 20.0
    blocklist_texts: []
    blocklist_patterns:
      - "^[!?.…\\s\\(\\)\\[\\]\\{\\}]+$"
      - "^[0-9\\s]+$"
      - "^[A-Za-z0-9\\(\\)\\s'!?.~-]{1,15}$"
      - "^[ㅋㅎㅠㅜ]+$"
      
merge:
  overlap_threshold: 0.3
  agree_threshold: 0.9
  fill_gaps: true
  gap_fill_min_duration: 0.5
  gap_fill_prefix: ""
  keep_unrelated_ocr: true   # keep on-screen info cards that overlap speech
  unrelated_threshold: 0.3   # below this similarity = different content
  info_min_chars: 20         # on-screen info must be a full line, or contain a digit

subtitles:
  max_chars_per_cue: 40      # split longer cues at sentence/word boundaries
  max_cue_duration: 6.0
  min_cue_duration: 0.5

uvr:
  enabled: false
  model: UVR_MDXNET_Main.onnx
  output_single_stem: Vocals
  model_dir: ""
