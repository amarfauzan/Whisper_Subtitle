chunk_length_seconds: 600

whisper:
  language: ko
  beam_size: 3
  best_of: 3
  max_line_length: 30

vad:
  min_subtitle_duration: 0.5
  max_subtitle_duration: 7.0
  max_merge_duration: 2.0

translation:
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  source_language: Korean
  target_language: English
  batch_size: 100
  max_retries: 3
  min_split_size: 50
  context: ""

transcription:
  enabled: false

ocr:
  enabled: true
  providers: ["CPUExecutionProvider"]
  sample_fps: 3
  rec_confidence: 0.6       # stricter without whisper to validate
  filter:
    min_duration: 1.0       # stricter for the same reason
    max_duration: 8.0
    min_box_height_ratio: 0.025
    max_box_height_ratio: 0.15
    min_text_length: 2
    blocklist_texts: []
    blocklist_patterns:
      - "^[!?.…\\s]+$"
      - "^[0-9\\s]+$"