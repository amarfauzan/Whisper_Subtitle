[project]
name = "whisper-subtitle"
version = "0.1.0"
description = "Generate subtitles from video using Whisper transcription, PaddleOCR, and optional DeepSeek translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audio-separator[cpu]>=0.47.0",
    "audioread>=3.1.0",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.13.0",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
]

[project.scripts]
whisper-subtitle = "whisper_subtitle.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers idiomatically build a base dict and .update() overrides,
# which ruff's C408 flags. Allow it in tests only.
"tests/**" = ["C408"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["yaml", "audio_separator.*", "onnxruntime.*"]
ignore_missing_imports = true
